<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Perhetreeni</title>
<style>
:root{--bg:#0f1115;--card:#181c23;--card2:#212631;--text:#f5f7fb;--muted:#a7afbb;--accent:#4da3ff;--line:#2c333f;--danger:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:22px 14px 90px}
h1{margin:4px 0 4px;font-size:30px}.sub{color:var(--muted);margin-bottom:20px}
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
button{font:inherit}
.profile,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:13px 10px;font-weight:700}
.profile.active{border-color:var(--accent);background:#17283b}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.danger{color:#ff9a9a;background:#351b1b;border-color:#5b2929}
.btn.small{padding:8px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}
h2{font-size:20px;margin:0 0 12px}
.exercise{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.exercise:first-of-type{border-top:0}
.name{font-weight:700}.muted{color:var(--muted);font-size:13px}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{background:var(--card2);border-radius:999px;padding:6px 9px;color:#cbd3df;font-size:12px;white-space:nowrap}.load{background:#17304a;color:#bdddff}
.editor-row{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px;margin:9px 0}
.editor-grid{display:grid;grid-template-columns:1fr 120px 120px;gap:8px}
input{width:100%;background:#151922;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}
.row-actions{display:flex;gap:6px;margin-top:8px}
.row-actions button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#151922;color:var(--text)}
.notice{border:1px dashed #4a5668;background:#151922;border-radius:14px;padding:13px;color:#c3cad4;font-size:14px;line-height:1.45;margin-top:16px}
.empty{color:var(--muted);padding:12px 0}
@media(max-width:520px){.editor-grid{grid-template-columns:1fr}.profiles{gap:7px}.profile{font-size:14px}}
</style>
</head>
<body>
<main>
<h1>💪 Perhetreeni</h1>
<div class="sub">Yhteinen treenisivu</div>

<div class="profiles">
<button class="profile active" data-id="mina">Minä</button>
<button class="profile" data-id="jenni">Jenni</button>
<button class="profile" data-id="rianna">Rianna</button>
</div>

<div class="toolbar">
<button id="editBtn" class="btn primary">✏️ Muokkaa ohjelmaa</button>
<button id="resetBtn" class="btn small danger">Palauta oletus</button>
</div>

<div id="view"></div>

<div class="notice">
<strong>Huom:</strong> ohjelman muokkaukset tallentuvat nyt tämän puhelimen/selaimen muistiin. Seuraava vaihe on yhteinen tietokanta, jolloin samat muutokset ja treenit näkyvät kaikille puhelimille.
</div>
</main>

<script>
const defaults={
  mina:{
    title:"Minun koko kropan treeni",
    exercises:[
      ["RDL","3 × 6–10",""],["Jalkaprässi","3 × 8–12",""],["Etureisiojennus","2 × 10–15",""],
      ["KP-penkki","3 × 8–12",""],["Vinopenkki Smith","2 × 8–12",""],["Ristitalja rinnalle","2 × 12–15",""],
      ["Leuat","3 sarjaa","oma paino"],["Soutu","3 × 8–12",""],["Ylätalja","2 × 10–12",""],["Vipari taljassa","2–3 × 12–15",""],
      ["Face pull / takaolkapää","2–3 × 12–15",""],["Hauiskääntö käsipainoilla","2–3 × 8–12",""],["Vasarakääntö","2–3 × 10–15",""]
    ]
  },
  jenni:{title:"Jennin treeniohjelma",exercises:[]},
  rianna:{title:"Riannan treeniohjelma",exercises:[]}
};

const KEY="perhetreeni_programs_v2";
let programs=loadPrograms();
let active="mina";
let editing=false;
let draft=null;

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadPrograms(){
  try{
    const saved=localStorage.getItem(KEY);
    return saved?JSON.parse(saved):clone(defaults);
  }catch(e){return clone(defaults)}
}
function savePrograms(){localStorage.setItem(KEY,JSON.stringify(programs))}

document.querySelectorAll(".profile").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(editing && !confirm("Hylätäänkö tallentamattomat muutokset?")) return;
    editing=false; active=btn.dataset.id; setActiveButton(); render();
  });
});
document.getElementById("editBtn").addEventListener("click",()=>{
  if(!editing){
    draft=clone(programs[active]); editing=true; render();
  }else{
    programs[active]=clone(draft); savePrograms(); editing=false; render();
  }
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("Palautetaanko tämän profiilin ohjelma oletukseen?")){
    programs[active]=clone(defaults[active]); savePrograms(); editing=false; render();
  }
});

function setActiveButton(){
  document.querySelectorAll(".profile").forEach(x=>x.classList.toggle("active",x.dataset.id===active));
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function render(){
  const editBtn=document.getElementById("editBtn");
  editBtn.textContent=editing?"💾 Tallenna ohjelma":"✏️ Muokkaa ohjelmaa";
  const v=document.getElementById("view");
  if(editing) return renderEditor(v);
  const p=programs[active];
  const rows=p.exercises.length?p.exercises.map(e=>`
    <div class="exercise">
      <div><div class="name">${esc(e[0])}</div></div>
      <div class="badges"><div class="badge">${esc(e[1])}</div>${e[2]?`<div class="badge load">${esc(e[2])}</div>`:""}</div>
    </div>`).join(""):`<div class="empty">Ei vielä liikkeitä. Paina “Muokkaa ohjelmaa” ja lisää ensimmäinen liike.</div>`;
  v.innerHTML=`<div class="card"><h2>${esc(p.title)}</h2>${rows}</div>`;
}
function renderEditor(v){
  const p=draft;
  v.innerHTML=`
    <div class="card">
      <h2>Muokkaa ohjelmaa</h2>
      <div style="margin-bottom:10px">
        <div class="muted" style="margin-bottom:5px">Ohjelman nimi</div>
        <input id="titleInput" value="${esc(p.title)}">
      </div>
      <div id="editorRows"></div>
      <button class="btn primary" style="width:100%;margin-top:8px" id="addEx">+ Lisää liike</button>
      <button class="btn" style="width:100%;margin-top:8px" id="cancelEdit">Peruuta</button>
    </div>`;
  document.getElementById("titleInput").addEventListener("input",e=>draft.title=e.target.value);
  document.getElementById("addEx").addEventListener("click",()=>{draft.exercises.push(["Uusi liike","3 × 10",""]);render()});
  document.getElementById("cancelEdit").addEventListener("click",()=>{editing=false;render()});
  const rows=document.getElementById("editorRows");
  p.exercises.forEach((e,i)=>{
    const row=document.createElement("div");
    row.className="editor-row";
    row.innerHTML=`
      <div class="editor-grid">
        <input class="exname" value="${esc(e[0])}" placeholder="Liike">
        <input class="exsets" value="${esc(e[1])}" placeholder="esim. 3 × 10"><input class="exload" value="${esc(e[2]||"")}" placeholder="Kuorma, esim. 80 kg">
      </div>
      <div class="row-actions">
        <button class="up">↑ Ylös</button>
        <button class="down">↓ Alas</button>
        <button class="del">Poista</button>
      </div>`;
    row.querySelector(".exname").addEventListener("input",ev=>draft.exercises[i][0]=ev.target.value);
    row.querySelector(".exsets").addEventListener("input",ev=>draft.exercises[i][1]=ev.target.value);row.querySelector(".exload").addEventListener("input",ev=>draft.exercises[i][2]=ev.target.value);
    row.querySelector(".up").addEventListener("click",()=>move(i,-1));
    row.querySelector(".down").addEventListener("click",()=>move(i,1));
    row.querySelector(".del").addEventListener("click",()=>{draft.exercises.splice(i,1);render()});
    rows.appendChild(row);
  });
}
function move(i,d){
  const j=i+d;if(j<0||j>=draft.exercises.length)return;
  [draft.exercises[i],draft.exercises[j]]=[draft.exercises[j],draft.exercises[i]];
  render();
}
render();
</script>
</body>
</html>
