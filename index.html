<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Perhetreeni</title>
<style>
:root{--bg:#0f1115;--card:#181c23;--card2:#212631;--text:#f5f7fb;--muted:#a7afbb;--accent:#4da3ff;--line:#2c333f;--ok:#51d46a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:22px 14px 90px}h1{margin:4px 0;font-size:30px}h2{font-size:20px;margin:0 0 12px}
.sub,.muted,.status,.history-date{color:var(--muted)}.sub{margin-bottom:16px}.status{font-size:13px;margin-bottom:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:6px}.dot.ok{background:var(--ok)}
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
button{font:inherit;cursor:pointer}.profile,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:13px 10px;font-weight:700}
.profile.active{border-color:var(--accent);background:#17283b}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.full{width:100%;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}
.exercise{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.exercise:first-of-type{border-top:0}.name{font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{background:var(--card2);border-radius:999px;padding:6px 9px;color:#cbd3df;font-size:12px}.load{background:#17304a;color:#bdddff}
.editor-row,.work-row{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px;margin:9px 0}
.editor-grid{display:grid;grid-template-columns:1fr 120px 120px;gap:8px}.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
input,textarea{width:100%;background:#151922;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}textarea{min-height:80px;margin-top:10px}
.row-actions{display:flex;gap:6px;margin-top:8px}.row-actions button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#151922;color:var(--text)}
.history-item{border-top:1px solid var(--line);padding:12px 0}.history-item:first-child{border-top:0}.history-user{font-weight:800}.history-entry{font-size:14px;padding:3px 0}.empty{color:var(--muted);padding:12px 0}.login{max-width:420px;margin:34px auto}.login input{text-align:center;letter-spacing:3px;font-weight:800;font-size:22px}
@media(max-width:560px){.editor-grid{grid-template-columns:1fr}.profile{font-size:14px}}
</style>
</head>
<body>
<main>
<h1>💪 Perhetreeni</h1>
<div class="sub">Yhteinen treenisivu · Minä · Jenni · Rianna</div>
<div id="loginView" class="login">
  <div class="card">
    <h2>🔒 Perheen PIN</h2>
    <div class="muted" style="margin-bottom:10px">Syötä PIN avataksesi treenit.</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••">
    <button id="pinBtn" class="btn primary full">Avaa</button>
    <div id="pinError" class="muted" style="margin-top:10px"></div>
  </div>
</div>

<div id="appView" hidden>
  <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Yhdistetään…</span></div>

  <div class="profiles">
    <button class="profile active" data-id="mina">Minä</button>
    <button class="profile" data-id="jenni">Jenni</button>
    <button class="profile" data-id="rianna">Rianna</button>
  </div>

  <div class="toolbar">
    <button id="workoutBtn" class="btn primary">🏋️ Kirjaa treeni</button>
    <button id="editBtn" class="btn">✏️ Muokkaa ohjelmaa</button>
    <button id="historyBtn" class="btn">📚 Yhteinen historia</button>
    <button id="lockBtn" class="btn">🔒 Lukitse</button>
  </div>

  <div id="view"></div>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
